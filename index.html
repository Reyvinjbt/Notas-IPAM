<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instituto Privado Adventista Matagalpa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="loginScreen" class="auth-screen">
      <div class="auth-card">
        <h1>Instituto Privado Adventista Matagalpa</h1>
        <p>Portal académico</p>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="username">Usuario</label>
            <input id="username" type="text" value="admin" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" value="1234" />
          </div>

          <button type="submit" class="login-btn">Iniciar sesión</button>
        </form>

        <div class="demo-note">Credenciales: admin / 1234</div>
      </div>
    </div>

    <div id="appScreen" class="app-shell hidden">
      <header class="topbar">
        <div class="topbar-row">
          <div>
            <h1>Instituto Privado Adventista Matagalpa</h1>
            <div class="topbar-sub">Sistema de control académico</div>
          </div>

          <div class="topbar-badges">
            <span class="badge">Undécimo Grado</span>
            <span class="badge">5to Año</span>
            <span class="badge">2026</span>
          </div>
        </div>

        <div class="nav">
          <button class="nav-btn active" data-tab="dashboard">Dashboard</button>
          <button class="nav-btn" data-tab="students">Estudiantes</button>
          <button class="nav-btn" data-tab="teachers">Docentes</button>
          <button class="nav-btn" data-tab="courses">Cursos</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="panel search-panel">
          <input id="searchInput" class="search-box" type="text" placeholder="Buscar estudiante por nombre..." />
        </div>

        <div class="panel filter-panel">
          <select id="courseFilter" class="select-box">
            <option value="Todos">Todos los cursos</option>
            <option value="Undécimo Grado">Undécimo Grado</option>
          </select>
        </div>

        <button id="addStudentBtn" class="primary-btn">Agregar estudiante</button>
      </div>

      <div id="dashboardTab" class="tab-section">
        <section id="stats" class="stats"></section>
      </div>

      <div id="studentsTab" class="tab-section hidden">
        <div class="grid-layout">
          <aside class="panel students-panel">
            <h2 class="panel-title">Estudiantes</h2>
            <div id="studentList" class="student-list"></div>
          </aside>

          <section class="panel detail-panel">
            <div id="detailPanel"></div>
          </section>
        </div>
      </div>

      <div id="teachersTab" class="tab-section hidden">
        <div class="panel teacher-panel">
          <h2 class="panel-title">Docentes</h2>
          <div id="teacherGrid" class="teacher-grid"></div>
        </div>
      </div>

      <div id="coursesTab" class="tab-section hidden">
        <div class="panel courses-panel">
          <h2 class="panel-title">Cursos y Materias</h2>
          <div id="courseGrid" class="course-grid"></div>
        </div>
      </div>
    </div>

    <div id="studentModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Nuevo estudiante</h3>
          <button type="button" class="close-btn" id="closeModalBtn">×</button>
        </div>

        <form id="studentForm">
          <div class="form-grid">
            <div class="form-field">
              <label for="newName">Nombre</label>
              <input id="newName" type="text" required />
            </div>

            <div class="form-field">
              <label for="newCourse">Curso</label>
              <select id="newCourse">
                <option value="Undécimo Grado">Undécimo Grado</option>
              </select>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" id="cancelStudentBtn">Cancelar</button>
            <button type="submit" class="primary-btn">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
