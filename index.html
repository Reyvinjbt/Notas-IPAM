<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instituto Privado Adventista Matagalpa</title>
    <style>
      :root {
        --primary: #1d4ed8;
        --primary-dark: #163ea8;
        --secondary: #0f172a;
        --card: #ffffff;
        --surface: #f8fafc;
        --muted: #64748b;
        --border: #e2e8f0;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #dc2626;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef6ff 0%, #f8fafc 100%);
        color: var(--secondary);
      }

      body {
        min-height: 100vh;
      }

      button, input, select {
        font: inherit;
      }

      .hidden {
        display: none !important;
      }

      .auth-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
        padding: 20px;
      }

      .auth-card {
        width: min(460px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 30px 24px;
      }

      .auth-card h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 3vw, 2.2rem);
        color: var(--primary-dark);
        text-align: center;
      }

      .auth-card p {
        text-align: center;
        color: var(--muted);
        margin-bottom: 24px;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: var(--secondary);
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
        outline: none;
      }

      .field input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
      }

      .login-btn, .primary-btn, .secondary-btn, .danger-btn, .modal-btn {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .login-btn, .primary-btn {
        background: var(--primary);
        color: white;
      }

      .login-btn:hover, .primary-btn:hover {
        background: var(--primary-dark);
      }

      .secondary-btn {
        background: #e2e8f0;
        color: var(--secondary);
      }

      .secondary-btn:hover {
        background: #d7e0ec;
      }

      .danger-btn {
        background: #fee2e2;
        color: #991b1b;
      }

      .danger-btn:hover {
        background: #fecaca;
      }

      .demo-info {
        text-align: center;
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .app-shell {
        max-width: 1260px;
        margin: 0 auto;
        padding: 18px 16px 32px;
      }

      .topbar {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        border-radius: 20px;
        padding: 22px 24px;
        box-shadow: var(--shadow);
        margin-bottom: 22px;
      }

      .topbar-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .school-name {
        margin: 0;
        font-size: clamp(1.6rem, 2vw, 2.4rem);
      }

      .school-subtitle {
        margin-top: 8px;
        opacity: 0.9;
        font-size: 0.95rem;
      }

      .topbar-badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .badge {
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1.7fr 1fr auto;
        gap: 14px;
        margin-bottom: 24px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .search-box, .select-box {
        width: 100%;
        border: 1px solid var(--border);
        background: white;
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--secondary);
      }

      .toolbar .panel {
        padding: 14px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px,1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .stat-label {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .stat-value {
        font-size: clamp(1.5rem,2vw,2.2rem);
        font-weight: 700;
      }

      .main-grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 22px;
      }

      .students-panel, .detail-panel {
        padding: 18px;
      }

      .panel-title {
        margin: 0 0 16px;
        font-size: 1.15rem;
      }

      .student-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .student-card {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .student-card:hover {
        transform: translateY(-2px);
        border-color: #c7d2fe;
      }

      .student-card.active {
        border-color: var(--primary);
        background: #eff6ff;
        box-shadow: inset 0 0 0 1px rgba(29, 78, 216, 0.1);
      }

      .student-card-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .student-name {
        margin: 0;
        font-weight: 700;
      }

      .student-average {
        font-weight: 800;
        color: var(--primary);
      }

      .student-course {
        margin-top: 6px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .empty-state {
        text-align: center;
        color: var(--muted);
        padding: 28px 12px;
      }

      .profile-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .profile-title {
        margin: 0;
        font-size: clamp(1.4rem, 2vw, 2rem);
      }

      .status-pill {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .status-good { background: #dcfce7; color: #166534; }
      .status-average { background: #fef3c7; color: #92400e; }
      .status-low { background: #fee2e2; color: #991b1b; }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .mini-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .mini-box-label {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .mini-box-value {
        margin-top: 8px;
        font-size: 1.3rem;
        font-weight: 700;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        background: var(--surface);
        color: var(--muted);
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      tbody td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      tbody td input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: white;
      }

      .detail-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        display: grid;
        place-items: center;
        padding: 20px;
        z-index: 10;
      }

      .modal-card {
        width: min(560px, 100%);
        background: white;
        border-radius: 18px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        padding: 22px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 1.3rem;
      }

      .close-btn {
        border: none;
        background: transparent;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--muted);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-field {
        display: flex;
        flex-direction: column;
      }

      .form-field label {
        margin-bottom: 8px;
        font-weight: 700;
      }

      .form-field input, .form-field select {
        width: 100%;
        padding: 11px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: white;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      @media (max-width: 980px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .main-grid {
          grid-template-columns: 1fr;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(140px, 1fr));
        }
      }

      @media (max-width: 560px) {
        .stats, .summary-grid, .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="loginScreen" class="auth-screen">
      <div class="auth-card">
        <h1>Instituto Privado Adventista Matagalpa</h1>
        <p>Control académico</p>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="username">Usuario</label>
            <input id="username" type="text" value="admin" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" value="1234" />
          </div>

          <button class="login-btn" type="submit">Iniciar sesión</button>
        </form>

        <div class="demo-info">Credenciales de prueba: admin / 1234</div>
      </div>
    </div>

    <div id="appScreen" class="app-shell hidden">
      <header class="topbar">
        <div class="topbar-row">
          <div>
            <h1 class="school-name">Instituto Privado Adventista Matagalpa</h1>
            <div class="school-subtitle">Sistema de control académico</div>
          </div>

          <div class="topbar-badges">
            <span class="badge">Undécimo Grado</span>
            <span class="badge">5to Año</span>
            <span class="badge">2026</span>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <div class="panel">
          <input id="searchInput" class="search-box" type="text" placeholder="Buscar estudiante por nombre..." />
        </div>

        <div class="panel">
          <select id="courseFilter" class="select-box">
            <option value="Todos">Todos los cursos</option>
            <option value="Undécimo Grado">Undécimo Grado</option>
          </select>
        </div>

        <button id="addStudentBtn" class="primary-btn">Agregar estudiante</button>
      </div>

      <section id="stats" class="stats"></section>

      <main class="main-grid">
        <aside class="panel students-panel">
          <h2 class="panel-title">Estudiantes</h2>
          <div id="studentList" class="student-list"></div>
        </aside>

        <section class="panel detail-panel">
          <div id="detailPanel"></div>
        </section>
      </main>
    </div>

    <div id="studentModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Nuevo estudiante</h3>
          <button id="closeModalBtn" class="close-btn" type="button" aria-label="Cerrar">×</button>
        </div>

        <form id="studentForm">
          <div class="form-grid">
            <div class="form-field">
              <label for="newName">Nombre</label>
              <input id="newName" type="text" required />
            </div>

            <div class="form-field">
              <label for="newCourse">Curso</label>
              <select id="newCourse">
                <option value="Undécimo Grado">Undécimo Grado</option>
              </select>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" id="cancelStudentBtn">Cancelar</button>
            <button type="submit" class="primary-btn">Guardar</button>
          </div>
        </form>
      </div>
    </div>

      function loadStudents() {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        state.students = saved && saved.length ? saved : initialStudents;
      }

      function saveStudents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.students));
      }

      function getAverage(notas) {
        if (!notas || notas.length === 0) return 0;
        const total = notas.reduce((sum, item) => sum + Number(item.nota || 0), 0);
        return total / notas.length;
      }

      function getStatusClass(avg) {
        if (avg >= 90) return "status-good";
        if (avg >= 75) return "status-average";
        return "status-low";
      }

      function getStatusText(avg) {
        if (avg >= 90) return "Excelente";
        if (avg >= 75) return "Aprobado";
        return "Necesita apoyo";
      }

      function getFilteredStudents() {
        const q = searchInput.value.trim().toLowerCase();
        const selectedCourse = courseFilter.value;

        return state.students.filter((student) => {
          const matchesSearch = !q || student.name.toLowerCase().includes(q);
          const matchesCourse = selectedCourse === "Todos" || student.course === selectedCourse;
          return matchesSearch && matchesCourse;
        });
      }

      function renderStats(filteredStudents) {
        const total = filteredStudents.length;
        const promedioGeneral =
          total === 0
            ? 0
            : filteredStudents.reduce((sum, s) => sum + getAverage(s.notas), 0) / total;

        const mejor =
          total === 0
            ? null
            : filteredStudents.reduce((prev, current) =>
                getAverage(current.notas) > getAverage(prev.notas) ? current : prev
              );

        const aprobados = filteredStudents.filter((s) => getAverage(s.notas) >= 75).length;

        const stats = [
          { label: "Total", value: total, color: "#1d4ed8" },
          { label: "Promedio", value: `${promedioGeneral.toFixed(1)}%`, color: "#0f172a" },
          { label: "Aprobados", value: aprobados, color: "#16a34a" },
          { label: "Mejor", value: mejor ? mejor.name.split(" ")[0] : "N/A", color: "#f59e0b" }
        ];

        statsEl.innerHTML = stats.map(item => `
          <div class="stat-card">
            <div class="stat-label">${item.label}</div>
            <div class="stat-value" style="color:${item.color}">${item.value}</div>
          </div>
        `).join("");
      }

      function renderStudentList() {
        const filtered = getFilteredStudents();

        if (filtered.length === 0) {
          studentList.innerHTML = '<div class="empty-state">No se encontraron estudiantes.</div>';
          renderStats([]);
          return;
        }

        const selected = filtered.find((s) => s.id === state.selectedStudentId) || filtered[0];
        state.selectedStudentId = selected.id;

        studentList.innerHTML = filtered.map((student) => {
          const avg = getAverage(student.notas);
          const activeClass = student.id === state.selectedStudentId ? "active" : "";

          return `
            <div class="student-card ${activeClass}" data-id="${student.id}">
              <div class="student-card-head">
                <p class="student-name">${student.name}</p>
                <span class="student-average">${avg.toFixed(1)}%</span>
              </div>
              <div class="student-course">${student.course}</div>
            </div>
          `;
        }).join("");

        studentList.querySelectorAll(".student-card").forEach((card) => {
          card.addEventListener("click", () => {
            state.selectedStudentId = Number(card.dataset.id);
            renderApp();
          });
        });

        renderDetail(selected);
        renderStats(filtered);
      }

      function renderDetail(student) {
        if (!student) {
          detailPanel.innerHTML = '<div class="empty-state">Selecciona un estudiante.</div>';
          return;
        }

        const avg = getAverage(student.notas);
        const status = getStatusClass(avg);
        const label = getStatusText(avg);

        detailPanel.innerHTML = `
          <div class="profile-head">
            <div>
              <h2 class="profile-title">${student.name}</h2>
              <div class="student-course">${student.course}</div>
            </div>
            <span class="status-pill ${status}">${label}</span>
          </div>

          <div class="summary-grid">
            <div class="mini-box">
              <div class="mini-box-label">Promedio</div>
              <div class="mini-box-value">${avg.toFixed(1)}%</div>
            </div>
            <div class="mini-box">
              <div class="mini-box-label">Materias</div>
              <div class="mini-box-value">${student.notas.length}</div>
            </div>
            <div class="mini-box">
              <div class="mini-box-label">Curso</div>
              <div class="mini-box-value">${student.course}</div>
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Materia</th>
                <th>Docente</th>
                <th>Nota</th>
              </tr>
            </thead>
            <tbody>
              ${student.notas.map((item, index) => `
                <tr>
                  <td>${item.materia}</td>
                  <td>${item.profesor || teacherBySubject[item.materia] || "Sin docente"}</td>
                  <td>
                    <input type="number" min="0" max="100" step="1" value="${item.nota}" data-index="${index}" />
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>

          <div class="detail-actions">
            <button type="button" class="secondary-btn" id="deleteStudentBtn">Eliminar</button>
            <button type="button" class="primary-btn" id="saveNotesBtn">Guardar notas</button>
          </div>
        `;

        const saveNotesBtn = document.getElementById("saveNotesBtn");
        saveNotesBtn.addEventListener("click", () => {
          const inputs = detailPanel.querySelectorAll("input[type='number']");
          const updated = student.notas.map((item, index) => {
            const value = Number(inputs[index]?.value || 0);
            return {
              ...item,
              nota: Math.min(100, Math.max(0, value))
            };
          });

          const index = state.students.findIndex((s) => s.id === student.id);
          state.students[index].notas = updated;
          saveStudents();
          renderApp();
        });

        const deleteStudentBtn = document.getElementById("deleteStudentBtn");
        deleteStudentBtn.addEventListener("click", () => {
          const confirmDelete = confirm(`¿Deseas eliminar a ${student.name}?`);
          if (!confirmDelete) return;

          state.students = state.students.filter((s) => s.id !== student.id);
          saveStudents();

          if (state.students.length > 0) {
            state.selectedStudentId = state.students[0].id;
          } else {
            state.selectedStudentId = null;
          }

          renderApp();
        });
      }

      function renderApp() {
        const filtered = getFilteredStudents();
        if (filtered.length > 0 && !filtered.some((s) => s.id === state.selectedStudentId)) {
          state.selectedStudentId = filtered[0].id;
        }

        renderStudentList();
      }

      function showApp() {
        loginScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");
        state.loggedIn = true;
        renderApp();
      }

      function showLogin() {
        appScreen.classList.add("hidden");
        loginScreen.classList.remove("hidden");
        state.loggedIn = false;
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        if (username === DEFAULT_USERNAME && password === DEFAULT_PASSWORD) {
          showApp();
        } else {
          alert("Credenciales incorrectas. Usa admin / 1234");
        }
      });

      addStudentBtn.addEventListener("click", () => {
        studentModal.classList.remove("hidden");
      });

      closeModalBtn.addEventListener("click", () => {
        studentModal.classList.add("hidden");
        studentForm.reset();
      });

      cancelStudentBtn.addEventListener("click", () => {
        studentModal.classList.add("hidden");
        studentForm.reset();
      });

      studentForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("newName").value.trim();
        const course = document.getElementById("newCourse").value;

        if (!name) {
          alert("Debes ingresar el nombre del estudiante.");
          return;
        }

        const newStudent = {
          id: Date.now(),
          name,
          course,
          notas: [
            { materia: "Matemáticas", nota: 0, profesor: teacherBySubject["Matemáticas"] },
            { materia: "Física", nota: 0, profesor: teacherBySubject["Física"] },
            { materia: "Lengua y Literatura", nota: 0, profesor: teacherBySubject["Lengua y Literatura"] },
            { materia: "Inglés", nota: 0, profesor: teacherBySubject["Inglés"] },
            { materia: "Ciencias Sociales", nota: 0, profesor: teacherBySubject["Ciencias Sociales"] },
            { materia: "Biología", nota: 0, profesor: teacherBySubject["Biología"] }
          ]
        };

        state.students.push(newStudent);
        state.selectedStudentId = newStudent.id;
        saveStudents();
        renderApp();
        studentForm.reset();
        studentModal.classList.add("hidden");
      });

      searchInput.addEventListener("input", renderApp);
      courseFilter.addEventListener("change", renderApp);

      function init() {
        loadStudents();
        state.selectedStudentId = state.students[0]?.id || null;
        showLogin();
      }

      init();
    </script>
  </body>
</html>
